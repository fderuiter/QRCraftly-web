[package]
name = "qr-decode"
description = "QR code decoder (ISO/IEC 18004): binarisation, finder and alignment patterns, perspective sampling, Reed-Solomon and every data mode."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
qrcraftly-core = { path = "../core" }

[dev-dependencies]
qr-encode = { path = "../qr-encode" }
