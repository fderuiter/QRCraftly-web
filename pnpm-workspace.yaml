packages:
  - '.'
# Supply chain (#1351, docs/SECURITY.md): only the packages below may run install scripts, a
# package with an unlisted install script fails the install, and a version must be a day old
# before it can be resolved. CI installs with --frozen-lockfile.
strictDepBuilds: true
minimumReleaseAge: 1440

allowBuilds:
  esbuild: true
  sharp: false
  workerd: true

minimumReleaseAgeExclude:
  - '@esbuild/aix-ppc64@0.28.1'
  - '@esbuild/android-arm64@0.28.1'
  - '@esbuild/android-arm@0.28.1'
  - '@esbuild/android-x64@0.28.1'
  - '@esbuild/darwin-arm64@0.28.1'
  - '@esbuild/darwin-x64@0.28.1'
  - '@esbuild/freebsd-arm64@0.28.1'
  - '@esbuild/freebsd-x64@0.28.1'
  - '@esbuild/linux-arm64@0.28.1'
  - '@esbuild/linux-arm@0.28.1'
  - '@esbuild/linux-ia32@0.28.1'
  - '@esbuild/linux-loong64@0.28.1'
  - '@esbuild/linux-mips64el@0.28.1'
  - '@esbuild/linux-ppc64@0.28.1'
  - '@esbuild/linux-riscv64@0.28.1'
  - '@esbuild/linux-s390x@0.28.1'
  - '@esbuild/linux-x64@0.28.1'
  - '@esbuild/netbsd-arm64@0.28.1'
  - '@esbuild/netbsd-x64@0.28.1'
  - '@esbuild/openbsd-arm64@0.28.1'
  - '@esbuild/openbsd-x64@0.28.1'
  - '@esbuild/openharmony-arm64@0.28.1'
  - '@esbuild/sunos-x64@0.28.1'
  - '@esbuild/win32-arm64@0.28.1'
  - '@esbuild/win32-ia32@0.28.1'
  - '@esbuild/win32-x64@0.28.1'
  - esbuild@0.28.1

# Each override says why it exists. Remove one when `pnpm audit` stays clean without it: the
# 2026-10-19 review dropped twelve that no longer changed what resolves (the tree passed
# `pnpm audit` with none of them), including an undici pin that held jsdom below the ^8 it asks for.
overrides:
  # One esbuild for Wrangler (which pins 0.28.1) and Vite, so a single build-script package is
  # allowed in `allowBuilds` and released early in `minimumReleaseAgeExclude` above.
  esbuild: 0.28.1
  # GHSA-wq5f-xc86-pv6w (librsvg in sharp < 0.35.5); Miniflare pins 0.35.4.
  sharp: "^0.35.5"

# Ignore SheetJS (xlsx) 0.18.5 advisories (Prototype Pollution and ReDoS) because SheetJS
# upstream npm package releases stopped at 0.18.5 on npmjs.org. SheetJS spreadsheet parsing is
# executed strictly in client-side volatile browser memory on user-provided local files without server execution.
auditConfig:
  ignoreGhsas:
    - GHSA-4r6h-8v6p-xvw6 # Prototype Pollution in sheetJS (<0.19.3)
    - GHSA-5pgg-2g8v-p4x9 # SheetJS Regular Expression Denial of Service (<0.20.2)

