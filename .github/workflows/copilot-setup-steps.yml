name: "Copilot Setup Steps"

# Copilot reads this job's steps; it only needs a manual run to check them (ADR 0050).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # CRITICAL: This exact job key name is required by GitHub Copilot
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup
