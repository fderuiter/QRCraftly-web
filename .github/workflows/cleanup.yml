name: Artifact & Branch Cleanup

on:
  schedule:
    - cron: '0 2 * * 0' # Weekly on Sunday at 2AM
  pull_request:
    types: [closed]
  workflow_dispatch:

# Read-only by default; each job asks only for the write scope it needs.
permissions:
  contents: read

jobs:
  cleanup_branches:
    name: Clean up abandoned/merged branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    permissions:
      contents: write # delete merged branch refs
      pull-requests: read
    steps:
      - name: Delete merged branches
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const defaultBranch = context.payload.repository.default_branch;
            const minAgeMs = 7 * 24 * 60 * 60 * 1000;

            // Get all unprotected branches (paginated past the first 100)
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner,
              repo,
              protected: false,
              per_page: 100
            });

            // The trunk is never a cleanup candidate, even when unprotected.
            const longLived = new Set(['main', defaultBranch]);

            // Branches backing an open PR stay, whatever their merge state.
            const openPulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
            const sameRepo = (pr) => pr.head.repo && pr.head.repo.full_name === `${owner}/${repo}`;
            const withOpenPr = new Set(openPulls.filter(sameRepo).map((pr) => pr.head.ref));

            // main takes squash merges only, so a merged branch's own commits never reach it and
            // compareCommits reports it as diverged. A branch counts as merged when a merged PR
            // came from it and the branch still points at that PR's last commit.
            const closedPulls = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'closed', per_page: 100 });
            const mergedHeads = new Map();
            for (const pr of closedPulls) {
              if (!pr.merged_at || !sameRepo(pr)) continue;
              const shas = mergedHeads.get(pr.head.ref) || new Map();
              shas.set(pr.head.sha, new Date(pr.merged_at).getTime());
              mergedHeads.set(pr.head.ref, shas);
            }

            for (const branch of branches) {
              if (longLived.has(branch.name) || withOpenPr.has(branch.name)) continue;

              try {
                // Leave anything that changed in the last week.
                const mergedAt = mergedHeads.get(branch.name)?.get(branch.commit.sha);
                if (mergedAt !== undefined) {
                  if (Date.now() - mergedAt < minAgeMs) continue;
                } else {
                  // No merged PR: the branch is merged only if its head is already in main
                  // (identical or behind), which also covers a branch with no commits of its own.
                  const { data: compare } = await github.rest.repos.compareCommits({
                    owner,
                    repo,
                    base: defaultBranch,
                    head: branch.name
                  });

                  if (compare.status !== 'identical' && compare.status !== 'behind') continue;

                  // A branch cut moments ago has no commits of its own yet and also looks merged;
                  // leave anything whose head commit is younger than a week.
                  const { data: head } = await github.rest.repos.getCommit({ owner, repo, ref: branch.commit.sha });
                  const committedAt = new Date(head.commit.committer.date).getTime();
                  if (Date.now() - committedAt < minAgeMs) continue;
                }

                console.log(`Deleting merged branch: ${branch.name}`);
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: `heads/${branch.name}`
                });
              } catch (e) {
                console.log(`Error checking/deleting branch ${branch.name}: ${e.message}`);
              }
            }

  cleanup_artifacts:
    name: Clean up stale workflow artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      actions: write # delete stale artifacts
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const daysToKeep = 7;
            const threshold = new Date(Date.now() - daysToKeep * 24 * 60 * 60 * 1000);
            
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            for (const artifact of artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < threshold) {
                console.log(`Deleting artifact: ${artifact.name} (Created: ${createdAt})`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id
                });
              }
            }
