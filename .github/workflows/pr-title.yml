name: PR Title

# main is squash-merged, so each PR title becomes one commit subject on main and one
# line in the changelog. The release engine derives the SemVer bump from those
# subjects, so they must be Conventional Commits.

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  # The ruleset requires `PR Title` on merge-queue groups too. The title was checked on
  # the pull request before it could join the queue, so the group run only reports it.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Bots edit titles and push in bursts; only the newest event per PR needs a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  conventional-title:
    name: PR Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title is a Conventional Commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            echo "OK: titles were checked on each pull request before it joined the merge queue."
            exit 0
          fi
          pattern='^(feat|fix|perf|refactor|docs|chore|test|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "OK: $PR_TITLE"
          else
            echo "::error::PR title must follow Conventional Commits, e.g. 'fix(scanner): handle empty frames'. See RELEASING.md."
            echo "Got: $PR_TITLE"
            exit 1
          fi
