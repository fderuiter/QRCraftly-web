name: Scheduled Dependency Audit

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC
  workflow_dispatch: {} # Allows manual execution for validation/testing

permissions:
  contents: read
  issues: write

# Cancel previous runs if a new commit is pushed to the same branch/ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Moderate-Severity Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      # continue-on-error lets the alert step see the result; the last step
      # still fails the job when the audit failed.
      - name: Run Moderate Dependency Audit
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      # One GitHub issue instead of an SMTP email (#1184): opened or commented on
      # when the audit fails, closed when it passes again.
      - name: Sync Dependency Audit Issue
        if: always() && steps.audit.outcome != 'skipped'
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/audit_issue.js

      - name: Fail When The Audit Failed
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::pnpm audit found a moderate or higher vulnerability."
          exit 1
