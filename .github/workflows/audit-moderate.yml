name: Scheduled Dependency Audit

on:
  schedule:
    - cron: '0 4 * * *' # Every day at 04:00 UTC
  workflow_dispatch: {} # Allows manual execution for validation/testing

permissions:
  contents: read
  issues: write

# Cancel previous runs if a new commit is pushed to the same branch/ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Moderate-Severity Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # continue-on-error lets the alert step see the result; the last step
      # still fails the job when the audit failed.
      - name: Run Moderate Dependency Audit
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=moderate

      - name: Run Python Dependency Audit
        id: python_audit
        continue-on-error: true
        # Upstream Semgrep 1.185.0 pins mcp==1.29.0 and opentelemetry-api~=1.37.0 (see .github/dependabot.yml);
        # ignore known CVEs in those pinned versions until Semgrep upgrades them upstream.
        run: |
          pip install --require-hashes -r requirements.txt
          pip-audit -r requirements.txt \
            --ignore-vuln CVE-2026-59951 \
            --ignore-vuln CVE-2026-116685 \
            --ignore-vuln CVE-2026-116684 \
            --ignore-vuln CVE-2026-116686 \
            --ignore-vuln CVE-2026-115563 \
            --ignore-vuln CVE-2026-114603 \
            --ignore-vuln CVE-2026-126360 \
            --ignore-vuln CVE-2026-115563

      # One GitHub issue instead of an SMTP email (#1184): opened or commented on
      # when the audit fails, closed when it passes again.
      - name: Sync Dependency Audit Issue
        if: always() && steps.audit.outcome != 'skipped' && steps.python_audit.outcome != 'skipped'
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          PYTHON_AUDIT_OUTCOME: ${{ steps.python_audit.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/audit_issue.js

      - name: Fail When The Audit Failed
        if: steps.audit.outcome == 'failure' || steps.python_audit.outcome == 'failure'
        run: |
          echo "::error::Dependency audit found a vulnerability."
          exit 1
