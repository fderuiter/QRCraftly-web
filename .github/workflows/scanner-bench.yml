name: Scanner Benchmark

# Decode rate and time per frame for each scanner decoder strategy over the generated
# corpus (pnpm run bench:scanner, #1103). Timing depends on the runner, so this is a
# report, not a PR gate: it runs weekly and on demand, optionally against a second ref
# (weekly since the repository went private and Actions minutes became metered, ADR 0050).
on:
  schedule:
    - cron: '0 5 * * 1' # Mondays at 05:00 UTC
  workflow_dispatch:
    inputs:
      compare_ref:
        description: 'Optional git ref to compare with the checked-out code (for example origin/main or a tag)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: Benchmark Scanner Decoders
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run Scanner Benchmark
        env:
          COMPARE_REF: ${{ inputs.compare_ref }}
        run: |
          if [ -n "$COMPARE_REF" ]; then
            pnpm run bench:scanner --by-category --ref WORKTREE --ref "$COMPARE_REF" | tee bench.txt
          else
            pnpm run bench:scanner --by-category | tee bench.txt
          fi
          {
            echo '## Scanner benchmark'
            echo
            cat bench.txt
          } >> "$GITHUB_STEP_SUMMARY"
