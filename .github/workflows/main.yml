name: CI/CD Pipeline

# Metered minutes (ADR 0050): pull requests run a Chromium-only E2E tier and sample
# Lighthouse; the full four-browser E2E and every-page Lighthouse run nightly on main,
# on release PRs and on PRs labelled `full-e2e`. Pushes to main do not re-run CI: the
# ruleset requires PRs to be up to date and squash-merges them, so the commit that
# lands is the tree its PR already tested. deploy-verify.yml checks the deploy instead.
# merge_group runs the ready-PR tier on each merge-queue group, so the `CI` check the
# ruleset requires also reports there once the merge queue is on (ADR 0051).
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 7 * * *' # Nightly full tier on main, 2am US Central (CDT)
  workflow_dispatch:
    inputs:
      full:
        description: 'Run the full tier (four-browser E2E and Lighthouse on every page)'
        type: boolean
        default: false

permissions:
  contents: read

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what this run does (scripts/ci/ci_plan.js): which E2E and Lighthouse tier,
  # whether the PR only changes docs, and whether a nightly run has anything new to test.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the nightly run compares main with the last successful nightly run
      pull-requests: read
    outputs:
      run_checks: ${{ steps.plan.outputs.run_checks }}
      code_changed: ${{ steps.plan.outputs.code_changed }}
      unit_tests: ${{ steps.plan.outputs.unit_tests }}
      slow_tests: ${{ steps.plan.outputs.slow_tests }}
      e2e: ${{ steps.plan.outputs.e2e }}
      lighthouse: ${{ steps.plan.outputs.lighthouse }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Find the last successful nightly run
        id: last-nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          sha="$(gh run list --repo "$REPO" --workflow main.yml --event schedule --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // ""' || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Plan the run
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          FULL_INPUT: ${{ inputs.full }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
          LAST_NIGHTLY_SHA: ${{ steps.last-nightly.outputs.sha }}
        run: node scripts/ci/ci_plan.js

  # Runs in parallel with the other jobs (none of them depends on it), so a new
  # upstream advisory never skips lint, tests or build. The CI aggregate requires it.
  dependency-audit:
    name: Dependency Audit
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

  # JOB 2: Consolidated Static Validation Quality Gate
  static-validation:
    name: Consolidated Static Validation
    needs: plan
    if: needs.plan.outputs.run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      # Our own script instead of a third-party action (#1183). It falls back to
      # every tracked file when it can't compute a diff, so the scanner fails safe.
      - name: Get changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci/changed_files.js

      - name: Run Sequential Static Validation
        run: pnpm run lint

      - name: Run ShellCheck Static Analysis
        run: shellcheck scripts/ci/*.sh .githooks/pre-commit

      - name: Run Secret Scanning Guardrail
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: node scripts/secret-scanner.js

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Semgrep
        # requirements.txt is a pip-compile lock with hashes (source: requirements.in).
        run: pip install --require-hashes -r requirements.txt

      - name: Run Semgrep
        run: semgrep ci --config=semgrep.yml --metrics=off --disable-version-check
        env:
          SEMGREP_APP_TOKEN: "" # Local run only

      - name: Test Semgrep rules
        run: semgrep --test --config semgrep.yml tests/semgrep/semgrep.tsx --metrics=off --disable-version-check

  # JOB 3: Unit Tests, split into shards that run in parallel. Each shard writes a
  # Vitest blob report with its coverage; `Unit Tests` merges them and checks the
  # coverage floors once, on the whole suite.
  test-shard:
    name: Unit Tests (shard ${{ matrix.shard }}/3)
    needs: plan
    if: needs.plan.outputs.unit_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run this shard's tests
        env:
          SHARD: ${{ matrix.shard }}
          VITEST_COVERAGE: "true"
          VITEST_SHARD_RUN: "true"
        # The blob report feeds the merge job; `dot` and `github-actions` print the failing
        # test's name and assertion in this log and annotate its line on the PR (#1482).
        run: pnpm exec vitest run --coverage --shard="$SHARD/3" --reporter=blob --reporter=dot --reporter=github-actions --outputFile.blob=".vitest-reports/blob-$SHARD-3.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test:
    name: Unit Tests
    needs: [plan, test-shard]
    if: ${{ !cancelled() && needs.plan.outputs.unit_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A failed shard fails this job, so the CI aggregate never reads it as skipped.
      - name: Require every shard to pass
        env:
          SHARDS_RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$SHARDS_RESULT" != "success" ]; then
            echo "::error::A unit test shard finished with '$SHARDS_RESULT'. Open the failed 'Unit Tests (shard N/3)' job: its log and the PR annotations name the failing test."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Download the shard reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: vitest-blob-*
          path: .vitest-reports/
          merge-multiple: true

      - name: Merge reports and check coverage
        run: pnpm exec vitest run --merge-reports --coverage
        env:
          VITEST_COVERAGE: "true"

      # Our own script instead of a third-party action (#1185). It writes the
      # coverage table to this run's summary page and needs no write permission.
      - name: Coverage summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/ci/coverage_summary.js

  # Tests of 5 s or more and the benchmarks (#1608), kept out of the shards: nightly, on the full
  # tier, and on ready PRs that touch the optical transfer code they cover (scripts/ci/ci_plan.js).
  slow-tests:
    name: Slow Tests
    needs: plan
    if: needs.plan.outputs.slow_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Run the slow tests and benchmarks
        run: pnpm run test:slow

  # JOB: Rust WebAssembly modules (#1182, ADR 0033). Installs the toolchain pinned in
  # crates/rust-toolchain.toml with the runner's own rustup, checks the crates, and
  # proves every committed src/wasm/*.wasm rebuilds byte-for-byte.
  wasm-reproducible:
    name: WebAssembly Reproducible Build
    needs: plan
    if: needs.plan.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Install the pinned Rust toolchain
        working-directory: crates
        run: rustup toolchain install

      - name: Check formatting
        working-directory: crates
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: crates
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Run Rust tests
        working-directory: crates
        run: cargo test --locked

      - name: Rebuild and compare the committed modules
        run: pnpm run wasm:check

  # JOB E2E: Playwright Cross-Browser Tests
  # Runs against the exact `dist` the Build job produced, so CI builds the app once.
  e2e:
    name: E2E Tests
    needs: [plan, build]
    if: needs.plan.outputs.e2e != 'none'
    runs-on: ubuntu-latest
    # About 1,100 tests on one worker take about 28 minutes (2026-10-04); the cap leaves room for retries.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cache-playwright: 'true'

      - name: Download Build Output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Each attempt is time-limited and retried (scripts/ci/install_playwright.sh), so a stalled
      # apt mirror costs minutes, not the whole job.
      # The PR tier needs only Chromium; the full tier installs every browser.
      - name: Install Playwright Browsers
        timeout-minutes: 13
        env:
          E2E_TIER: ${{ needs.plan.outputs.e2e }}
        run: |
          if [ "$E2E_TIER" = "full" ]; then
            bash scripts/ci/install_playwright.sh
          else
            bash scripts/ci/install_playwright.sh chromium
          fi

      # PR tier: the chromium and chromium-csp projects. Full tier (nightly, release PRs,
      # the `full-e2e` label): Firefox and WebKit as well.
      - name: Run Playwright tests
        env:
          # Serve the downloaded build with `vite preview` instead of rebuilding.
          PLAYWRIGHT_USE_EXISTING_BUILD: "true"
          E2E_TIER: ${{ needs.plan.outputs.e2e }}
        run: |
          if [ "$E2E_TIER" = "full" ]; then
            pnpm run test:e2e
          else
            pnpm run test:e2e --project=chromium --project=chromium-csp
          fi

      - name: Run Development Hydration Tests
        run: pnpm run test:e2e:dev

      # The list reporter writes no HTML report; keep the failing tests' screenshots,
      # diffs and traces instead so visual baselines can be reviewed and refreshed.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  # JOB 5: Build Application
  build:
    name: Build
    needs: plan # E2E and Lighthouse consume this job's dist artifact
    if: needs.plan.outputs.code_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # Required for posting comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - run: pnpm run build

      - name: Upload Build Output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Check Bundle Size
        run: node scripts/check-bundle-size.js

      - name: Test Build Output
        run: pnpm run test:build

      - name: Generate Resource Quota Report
        if: github.event_name == 'pull_request'
        run: node scripts/resource-quota-report.js

      - name: Post Resource Quota Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quota-report.md', 'utf8');
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.error("Warning: Failed to post Resource Quota comment due to a GitHub API error:", error);
            }

  # Audits the exact `dist` the Build job produced. Each page runs three times and the
  # median run is asserted, so one noisy run on a shared runner cannot fail CI.
  lighthouse:
    name: Lighthouse
    needs: [plan, build]
    if: needs.plan.outputs.lighthouse != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write # Required for posting comments
    steps:
      # LHCI reads the commit hash from git when it uploads the reports.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Build Output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Pull requests audit one page of each template; the full tier audits every page.
      - name: Sample pages for a pull request
        if: needs.plan.outputs.lighthouse == 'sample'
        run: node scripts/ci/lighthouse_sample.js dist/lighthouserc.json

      - name: Run Lighthouse CI
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          # Generated by scripts/generate_lhci_manifest.js during postbuild from the
          # tracked lighthouserc.json base config plus the pre-rendered routes.
          configPath: "./dist/lighthouserc.json"
          # The action's own `runs` input overrides `numberOfRuns` in the config.
          runs: 3
          uploadArtifacts: true
          # The repository is private: keep the reports in this run's artifacts instead
          # of uploading them to Google's public temporary storage.
          temporaryPublicStorage: false

      - name: Post Lighthouse Comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LINKS: ${{ steps.lighthouse_audit.outputs.links }}
          MANIFEST: ${{ steps.lighthouse_audit.outputs.manifest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let links = {};
            let manifest = [];
            try {
              links = process.env.LINKS ? JSON.parse(process.env.LINKS) : {};
            } catch (e) {
              console.log('Error parsing process.env.LINKS:', e);
            }
            try {
              manifest = process.env.MANIFEST ? JSON.parse(process.env.MANIFEST) : [];
            } catch (e) {
              console.log('Error parsing process.env.MANIFEST:', e);
            }

            // Always print the report links to the pull request/workflow check log
            if (manifest && manifest.length > 0) {
              console.log('\n======================================================================');
              console.log('⚡️ LIGHTHOUSE AUDIT REPORT LINKS FOR THIS BUILD ⚡️');
              manifest.forEach((result) => {
                const reportUrl = links[result.url];
                if (reportUrl) {
                  console.log(`- URL: ${result.url}`);
                  console.log(`  Report: ${reportUrl}`);
                }
              });
              console.log('======================================================================\n');
            } else {
              console.log('No Lighthouse manifest found or Lighthouse audit was not completed.');
            }

            if (context.eventName === 'pull_request') {
              if (!manifest || manifest.length === 0) {
                 core.setFailed('Lighthouse MANIFEST is missing or empty. Please check the Lighthouse CI action logs.');
                 return;
              }

              const formatScore = (score) => Math.round(score * 100);
              const scoreIcon = (score) => score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴';

              let comment = '## ⚡️ Lighthouse Report\n\n';

              manifest.forEach((result) => {
                const summary = result.summary;
                const reportUrl = links[result.url];

                comment += `### URL: ${result.url}\n`;
                if (reportUrl) comment += `[View Full Report](${reportUrl})\n\n`;

                comment += '| Category | Score |\n';
                comment += '| --- | --- |\n';

                ['performance', 'accessibility', 'best-practices', 'seo', 'pwa'].forEach(key => {
                  if (summary[key] !== undefined) {
                     const score = summary[key];
                     comment += `| ${key} | ${scoreIcon(score)} ${formatScore(score)} |\n`;
                  }
                });
                comment += '\n';
              });

              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              } catch (error) {
                console.error("Warning: Failed to post Lighthouse report comment due to a GitHub API error:", error);
              }
            }

  # Single required check for rulesets. Branch rules require "CI" instead of every
  # job name, so renaming or adding jobs never leaves a PR waiting on a check that
  # no longer reports. It is also what auto-merge waits on (see RELEASING.md).
  # A job the plan skipped (E2E on a draft, the build on a docs-only PR) counts as a
  # pass; a failed or cancelled job, or a plan that did not succeed, fails it.
  # It skips a run that was cancelled as a whole (a newer push superseded it), so a
  # superseded run does not wait in the runner queue just to report a failure.
  ci:
    name: CI
    needs: [plan, dependency-audit, static-validation, test, slow-tests, wasm-reproducible, e2e, build, lighthouse]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # the nightly run opens or closes its alert issue
    steps:
      - name: Require every planned quality job to succeed
        id: check
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Plan: $PLAN_RESULT. Job results: $NEEDS_RESULTS"
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::The Plan job finished with '$PLAN_RESULT'."
            exit 1
          fi
          for result in $NEEDS_RESULTS; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::A required CI job finished with '$result'."
              exit 1
            fi
          done

      # A red nightly run opens one issue (and a green one closes it) instead of an email
      # nobody reads. Only nightly runs that tested something report.
      - name: Check out the alert script
        if: always() && github.event_name == 'schedule' && needs.plan.outputs.run_checks == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync Nightly CI Issue
        if: always() && github.event_name == 'schedule' && needs.plan.outputs.run_checks == 'true'
        env:
          CI_OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/nightly_issue.js
