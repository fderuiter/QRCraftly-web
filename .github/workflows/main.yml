name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths: &workflow_paths
      - 'src/**'
      - 'crates/**'
      - 'public/**'
      - 'scripts/**'
      - 'e2e/**'
      - 'tests/**'
      - 'docs/**'
      - '*.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'eslint.config.js'
      - 'knip.json'
      - '.jscpd.json'
      - '.dependency-cruiser.cjs'
      - 'semgrep.yml'
      - 'tests/semgrep/**'
      - 'requirements.txt'
      - 'playwright.config.ts'
      - 'vite.config.ts'
      - 'vitest.setup.ts'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - 'playwright.dev.config.ts'
      - 'lint-staged.config.js'
      - '.husky/**'
      - '.nvmrc'
      - '.node-version'
      - '.prettierrc.json'
      - '.prettierignore'
      - '.gitleaks.toml'
      - '.github/rulesets/**'
      - 'lighthouserc.json'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Manual trigger for re-running CI without a code push. Releases are tagged by
    # .github/workflows/release.yml when a release PR merges (see RELEASING.md).

permissions:
  contents: read

# Cancel previous runs if a new commit is pushed to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # JOB 1: Install Deps & Cache
  setup:
    name: Setup & Install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

  # Runs in parallel with the other jobs (none of them depends on it), so a new
  # upstream advisory never skips lint, tests or build. The CI aggregate requires it.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

  # JOB 2: Consolidated Static Validation Quality Gate
  static-validation:
    name: Consolidated Static Validation
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      # Our own script instead of a third-party action (#1183). It falls back to
      # every tracked file when it can't compute a diff, so the scanner fails safe.
      - name: Get changed files
        id: changed-files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/ci/changed_files.js

      - name: Run Sequential Static Validation
        run: pnpm run lint

      - name: Run ShellCheck Static Analysis
        run: shellcheck scripts/ci/*.sh

      - name: Run Secret Scanning Guardrail
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.files }}
        run: node scripts/secret-scanner.js

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install Semgrep
        # requirements.txt is a pip-compile lock with hashes (source: requirements.in).
        run: pip install --require-hashes -r requirements.txt

      - name: Run Semgrep
        run: semgrep ci --config=semgrep.yml --metrics=off --disable-version-check
        env:
          SEMGREP_APP_TOKEN: "" # Local run only

      - name: Test Semgrep rules
        run: semgrep --test --config semgrep.yml tests/semgrep/semgrep.tsx --metrics=off --disable-version-check

  # JOB 3: Unit Tests
  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - run: pnpm exec vitest run --coverage
        env:
          VITEST_COVERAGE: "true"

      - name: "Report Coverage"
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2

  # JOB: Rust WebAssembly modules (#1182, ADR 0033). Installs the toolchain pinned in
  # crates/rust-toolchain.toml with the runner's own rustup, checks the crates, and
  # proves every committed src/wasm/*.wasm rebuilds byte-for-byte.
  wasm-reproducible:
    name: WebAssembly Reproducible Build
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Install the pinned Rust toolchain
        working-directory: crates
        run: rustup toolchain install

      - name: Check formatting
        working-directory: crates
        run: cargo fmt --all --check

      - name: Run Clippy
        working-directory: crates
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings

      - name: Run Rust tests
        working-directory: crates
        run: cargo test --locked

      - name: Rebuild and compare the committed modules
        run: pnpm run wasm:check

  # JOB E2E: Playwright Cross-Browser Tests
  # Runs against the exact `dist` the Build job produced, so CI builds the app once.
  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    # About 1,100 tests on one worker take about 28 minutes (2026-10-04); the cap leaves room for retries.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cache-playwright: 'true'

      - name: Download Build Output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        env:
          # Serve the downloaded build with `vite preview` instead of rebuilding.
          PLAYWRIGHT_USE_EXISTING_BUILD: "true"
        run: pnpm run test:e2e

      - name: Run Development Hydration Tests
        run: pnpm run test:e2e:dev

      # The list reporter writes no HTML report; keep the failing tests' screenshots,
      # diffs and traces instead so visual baselines can be reviewed and refreshed.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14

  # JOB 5: Build Application
  build:
    name: Build
    needs: setup # E2E consumes this job's dist artifact, so build first
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # Required for posting comments
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup

      - run: pnpm run build

      - name: Upload Build Output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Check Bundle Size
        run: node scripts/check-bundle-size.js

      - name: Generate Resource Quota Report
        if: github.event_name == 'pull_request'
        run: node scripts/resource-quota-report.js

      - name: Post Resource Quota Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('quota-report.md', 'utf8');
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: report
              });
            } catch (error) {
              console.error("Warning: Failed to post Resource Quota comment due to a GitHub API error:", error);
            }

  # Audits the exact `dist` the Build job produced. Each page runs three times and the
  # median run is asserted, so one noisy run on a shared runner cannot fail CI.
  lighthouse:
    name: Lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: write # Required for posting comments
    steps:
      # LHCI reads the commit hash from git when it uploads the reports.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Build Output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI
        id: lighthouse_audit
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          # Generated by scripts/generate_lhci_manifest.js during postbuild from the
          # tracked lighthouserc.json base config plus the pre-rendered routes.
          configPath: "./dist/lighthouserc.json"
          # The action's own `runs` input overrides `numberOfRuns` in the config.
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Post Lighthouse Comment
        if: always()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          LINKS: ${{ steps.lighthouse_audit.outputs.links }}
          MANIFEST: ${{ steps.lighthouse_audit.outputs.manifest }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let links = {};
            let manifest = [];
            try {
              links = process.env.LINKS ? JSON.parse(process.env.LINKS) : {};
            } catch (e) {
              console.log('Error parsing process.env.LINKS:', e);
            }
            try {
              manifest = process.env.MANIFEST ? JSON.parse(process.env.MANIFEST) : [];
            } catch (e) {
              console.log('Error parsing process.env.MANIFEST:', e);
            }

            // Always print the report links to the pull request/workflow check log
            if (manifest && manifest.length > 0) {
              console.log('\n======================================================================');
              console.log('⚡️ LIGHTHOUSE AUDIT REPORT LINKS FOR THIS BUILD ⚡️');
              manifest.forEach((result) => {
                const reportUrl = links[result.url];
                if (reportUrl) {
                  console.log(`- URL: ${result.url}`);
                  console.log(`  Report: ${reportUrl}`);
                }
              });
              console.log('======================================================================\n');
            } else {
              console.log('No Lighthouse manifest found or Lighthouse audit was not completed.');
            }

            if (context.eventName === 'pull_request') {
              if (!manifest || manifest.length === 0) {
                 core.setFailed('Lighthouse MANIFEST is missing or empty. Please check the Lighthouse CI action logs.');
                 return;
              }

              const formatScore = (score) => Math.round(score * 100);
              const scoreIcon = (score) => score >= 0.9 ? '🟢' : score >= 0.5 ? '🟠' : '🔴';

              let comment = '## ⚡️ Lighthouse Report\n\n';

              manifest.forEach((result) => {
                const summary = result.summary;
                const reportUrl = links[result.url];

                comment += `### URL: ${result.url}\n`;
                if (reportUrl) comment += `[View Full Report](${reportUrl})\n\n`;

                comment += '| Category | Score |\n';
                comment += '| --- | --- |\n';

                ['performance', 'accessibility', 'best-practices', 'seo', 'pwa'].forEach(key => {
                  if (summary[key] !== undefined) {
                     const score = summary[key];
                     comment += `| ${key} | ${scoreIcon(score)} ${formatScore(score)} |\n`;
                  }
                });
                comment += '\n';
              });

              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: comment
                });
              } catch (error) {
                console.error("Warning: Failed to post Lighthouse report comment due to a GitHub API error:", error);
              }
            }

  # Single required check for rulesets. Branch rules require "CI" instead of every
  # job name, so renaming or adding jobs never leaves a PR waiting on a check that
  # no longer reports. It is also what auto-merge waits on (see RELEASING.md).
  ci:
    name: CI
    needs: [setup, dependency-audit, static-validation, test, wasm-reproducible, e2e, build, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality job to succeed
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $NEEDS_RESULTS"
          for result in $NEEDS_RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::A required CI job finished with '$result'."
              exit 1
            fi
          done

  # Cloudflare Workers Builds deploys every push to main to production on its own.
  # Wait until production serves this commit, then smoke test it.
  verify-staging:
    name: Verify Production Deployment
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cache-playwright: 'true'

      - name: Wait for staging to serve this commit
        env:
          BASE_URL: "https://qrcraftly.fpderuiter.workers.dev"
          EXPECTED_COMMIT: ${{ github.sha }}
        run: bash scripts/ci/wait_for_deploy.sh

      - name: Run Playwright Smoke Tests on Production
        env:
          PLAYWRIGHT_TEST_BASE_URL: "https://qrcraftly.fpderuiter.workers.dev"
        run: bash scripts/ci/run_smoke_tests.sh
