name: Release

# Tags and publishes a release when a release PR merges into main. See RELEASING.md.
#
# `pnpm run release:prepare` opens a release PR that bumps package.json and adds a
# CHANGELOG.md section. When that PR is squash-merged, this workflow sees a
# package.json version on main with no published release, creates the annotated tag
# vX.Y.Z on that commit and a DRAFT GitHub Release, waits for Cloudflare Workers
# Builds to serve the version on both production URLs, smoke tests workers.dev, and only
# then publishes the release. A published GitHub Release therefore always names what
# Cloudflare is serving; a failed or stale deploy leaves the release as a draft. The full
# smoke suite also runs on qrcraftly.com, but only as a warning: Cloudflare zone features
# there (such as JavaScript Detections) change pages without changing the build.
# Cloudflare is not touched: Workers Builds still deploys every push to main itself.
#
# Every other push to main finds the release already published and does nothing. The
# only thing this workflow pushes is the tag; it never pushes a branch.

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to republish and verify, e.g. v0.9.0 (leave empty to tag the current main)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Tag & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      published: ${{ steps.resolve.outputs.published }}
      tag: ${{ steps.resolve.outputs.tag }}
      latest: ${{ steps.resolve.outputs.latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve the release to publish
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$TAG" ]; then
            echo "::error::Tag $INPUT_TAG does not match package.json version $VERSION at that tag."
            exit 1
          fi

          # A published release means this version is already live; a draft means an
          # earlier run stopped before production served it, so this run finishes it.
          if [ -z "$INPUT_TAG" ]; then
            if VIEW_OUTPUT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1); then
              if [ "$VIEW_OUTPUT" != "true" ]; then
                echo "$TAG already has a published GitHub release; this push is not a new release."
                echo "published=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "$TAG has a draft release from an earlier run; finishing it."
            elif ! grep -qi "release not found" <<<"$VIEW_OUTPUT"; then
              echo "::error::Could not check for an existing $TAG release: $VIEW_OUTPUT"
              exit 1
            fi
          fi

          # Only the newest version becomes "Latest", so republishing an old tag by hand
          # never takes the badge from the release production is serving. Only vX.Y.Z tags
          # count: stray tags such as v.0.4.0 sort after every real version.
          NEWEST=$( { git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "$TAG"; } | sort -uV | tail -n 1)
          if [ "$NEWEST" = "$TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::package.json is $VERSION but CHANGELOG.md has no section for it. Cut releases with pnpm run release:prepare."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        if: steps.resolve.outputs.published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: node scripts/release_engine.js --notes "$RELEASE_VERSION" > "$RUNNER_TEMP/release_notes.md"

      - name: Create annotated tag
        if: steps.resolve.outputs.published == 'true' && inputs.tag == ''
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          fi
          git push origin "refs/tags/$RELEASE_TAG"

      # The release stays a draft until production serves it (see the publish-release job).
      # A release that is already public (a manual republish) keeps its state and gets
      # fresh notes.
      - name: Draft GitHub Release
        if: steps.resolve.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_notes.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_notes.md"
          fi

  # The release gate. workers.dev serves exactly what Workers Builds deployed, with no zone
  # features in front of it, so the full smoke suite (CSP, Trusted Types, no outbound data,
  # build integrity) runs there and must pass.
  smoke-tests:
    name: Production Smoke Tests (workers.dev)
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: https://qrcraftly.fpderuiter.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cache-playwright: 'true'

      # On a timeout the script prints the last response's status, headers and body start.
      # There is no blind retry: a stale production must fail the release.
      - name: Wait for workers.dev to serve this release
        env:
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
          TIMEOUT_SECONDS: '900'
        run: bash scripts/ci/wait_for_deploy.sh

      - name: Run Smoke Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ env.BASE_URL }}
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/ci/run_smoke_tests.sh

  # Also part of the gate: the custom domain must serve this version too, so the release
  # never goes public while qrcraftly.com still serves the old one. It gets 30 minutes
  # (#1217, #1394) and no blind retry.
  custom-domain-version:
    name: Wait for qrcraftly.com
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          sparse-checkout: scripts/ci
          persist-credentials: false

      - name: Wait for qrcraftly.com to serve this release
        env:
          BASE_URL: https://qrcraftly.com
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
          TIMEOUT_SECONDS: '1800'
        run: bash scripts/ci/wait_for_deploy.sh

  # Advisory, not part of the gate. Cloudflare zone features on the custom domain (such as
  # JavaScript Detections from Bot Fight Mode) inject scripts that the strict suite rightly
  # flags, and those are dashboard settings, not the build. This job still runs the full suite
  # there and turns a failure into a warning on the run, so the drift stays visible without
  # holding the release back.
  custom-domain-smoke:
    name: qrcraftly.com Smoke Tests (advisory)
    needs: [publish, custom-domain-version]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Environment
        uses: ./.github/actions/setup
        with:
          cache-playwright: 'true'

      - name: Run Smoke Tests against qrcraftly.com
        env:
          PLAYWRIGHT_TEST_BASE_URL: https://qrcraftly.com
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          if bash scripts/ci/run_smoke_tests.sh; then
            echo "qrcraftly.com passed the full smoke suite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=qrcraftly.com differs from the build::The smoke suite failed on https://qrcraftly.com but passed on workers.dev. A Cloudflare zone feature (for example JavaScript Detections) is changing pages on the custom domain. See docs/SECURITY.md, Zone features."
            echo "qrcraftly.com failed the smoke suite (advisory). See the log for the failing checks." >> "$GITHUB_STEP_SUMMARY"
          fi

  # Runs only when workers.dev passes the smoke suite and both production URLs serve this
  # version, so the public GitHub Release matches what Cloudflare Workers Builds deployed.
  publish-release:
    name: Publish GitHub Release
    needs: [publish, smoke-tests, custom-domain-version]
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the release production is serving
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          MAKE_LATEST: ${{ needs.publish.outputs.latest }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" --draft=false --latest="$MAKE_LATEST"
          echo "Published $RELEASE_TAG (latest: $MAKE_LATEST) after https://qrcraftly.com and https://qrcraftly.fpderuiter.workers.dev served it." >> "$GITHUB_STEP_SUMMARY"
