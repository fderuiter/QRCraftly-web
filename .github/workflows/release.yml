name: Release

# Tags and publishes a release when a release PR merges into main. See RELEASING.md.
#
# `pnpm run release:prepare` opens a release PR that bumps package.json and adds a
# CHANGELOG.md section. When that PR is squash-merged, this workflow sees a
# package.json version on main with no matching tag, creates the annotated tag
# vX.Y.Z on that commit, publishes the GitHub Release, waits for Cloudflare Workers
# Builds to serve the version in production, and smoke tests it.
#
# Every other push to main finds the tag already exists and does nothing. The only
# thing this workflow pushes is the tag; it never pushes a branch.

on:
  push:
    branches: [main]
    paths: ['package.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to republish and verify, e.g. v0.9.0 (leave empty to tag the current main)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Tag & Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      published: ${{ steps.resolve.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0

      - name: Resolve the release to publish
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json','utf8')).version")
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ -n "$INPUT_TAG" ] && [ "$INPUT_TAG" != "$TAG" ]; then
            echo "::error::Tag $INPUT_TAG does not match package.json version $VERSION at that tag."
            exit 1
          fi

          if [ -z "$INPUT_TAG" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already has a published GitHub release; this push is not a new release."
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "::error::package.json is $VERSION but CHANGELOG.md has no section for it. Cut releases with pnpm run release:prepare."
            exit 1
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        if: steps.resolve.outputs.published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: node scripts/release_engine.js --notes "$RELEASE_VERSION" > "$RUNNER_TEMP/release_notes.md"

      - name: Create annotated tag
        if: steps.resolve.outputs.published == 'true' && inputs.tag == ''
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          fi
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub Release
        if: steps.resolve.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_notes.md" --latest
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release_notes.md" --latest
          fi

  smoke-tests:
    name: Production Smoke Tests
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        base_url:
          - https://qrcraftly.fpderuiter.workers.dev
          - https://qrcraftly.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup Environment
        uses: ./.github/actions/setup

      - name: Wait for production to serve this release
        env:
          BASE_URL: ${{ matrix.base_url }}
          EXPECTED_VERSION: ${{ needs.publish.outputs.version }}
        run: bash scripts/ci/wait_for_deploy.sh

      - name: Run Smoke Tests
        env:
          PLAYWRIGHT_TEST_BASE_URL: ${{ matrix.base_url }}
        run: bash scripts/ci/run_smoke_tests.sh
