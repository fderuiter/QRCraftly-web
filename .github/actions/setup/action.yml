name: "Setup Environment"
description: "Installs pnpm (version from package.json packageManager) and Node.js (version from .nvmrc), restores the pnpm store cache, and installs dependencies."
inputs:
  node-version:
    description: "Node.js version override. Leave empty to use the version pinned in .nvmrc."
    required: false
    default: ""
  install:
    description: "Whether to install dependencies"
    required: false
    default: "true"
  cache-playwright:
    description: "Whether to cache Playwright browser binaries in ~/.cache/ms-playwright"
    required: false
    default: "false"
outputs:
  cache-hit:
    description: "Whether the pnpm store cache was restored from an exact key match."
    value: ${{ steps.setup-node.outputs.cache-hit }}
runs:
  using: "composite"
  steps:
    # Reads the pnpm version from the packageManager field in package.json, so the
    # version is declared in one place.
    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Uses .nvmrc unless the caller passes node-version (a non-empty node-version
    # takes precedence over node-version-file). Caches the pnpm store keyed on
    # pnpm-lock.yaml; the cache-hit output above comes from this step.
    - name: Set up Node.js
      id: setup-node
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: pnpm

    - name: Cache Playwright Browsers
      if: ${{ inputs.cache-playwright == 'true' }}
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

    - name: Install Dependencies
      if: ${{ inputs.install == 'true' }}
      run: timeout 600 pnpm install --frozen-lockfile
      shell: bash
